<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategi prototype 8 · mobil</title>
<style>
  :root { --ground: #EDE9E3; --ink: #000; --white: #fff; --orange: #FA4B0B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #CFCAC2; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px 16px 72px; }
  /* iPhone 14/15 size in CSS px (390 x 844), the common width to design mobile against */
  .phone { width: 390px; height: min(844px, calc(100vh - 96px)); background: var(--white); box-shadow: 0 30px 60px rgba(64,26,8,.12), 0 4px 8px rgba(64,26,8,.12); }
  .phone iframe { display: block; width: 100%; height: 100%; border: 0; }
  .size { position: fixed; left: 16px; bottom: 16px; font: 600 12px/1 system-ui, sans-serif; letter-spacing: .8px; text-transform: uppercase; }
  .size button { font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 10px 12px 9px; background: var(--white); border: 1px solid var(--ink); margin-right: -1px; cursor: pointer; }
  .size button[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .view-toggle { position: fixed; right: 16px; bottom: 16px; display: flex; background: var(--white); border: 1px solid var(--ink); font: 600 12px/1 system-ui, sans-serif; letter-spacing: .8px; text-transform: uppercase; }
  .view-toggle a { padding: 10px 14px 9px; color: var(--ink); text-decoration: none; }
  .view-toggle a[aria-current="true"] { background: var(--ink); color: var(--white); }
  .view-toggle a:not([aria-current="true"]):hover { color: var(--orange); }
</style>
</head>
<body>
  <div class="phone" id="phone"><iframe src="about:blank" title="Strategiside i mobilvisning"></iframe></div>
  <div class="size" role="group" aria-label="Skærmstørrelse">
    <button type="button" data-w="375" data-h="667">375</button><button type="button" data-w="390" data-h="844" aria-pressed="true">390</button>
  </div>
  <nav class="view-toggle" aria-label="Visning"><a href="index.html" onclick="event.preventDefault(); location.replace('index.html?r=' + Date.now());">Desktop</a><a href="mobil.html" aria-current="true" onclick="event.preventDefault(); location.replace('mobil.html?r=' + Date.now());">Mobil</a></nav>
<script>
  var phone = document.getElementById('phone');
  /* Søren, 20 Nov: the page in the phone always loads fresh, never from the cache */
  phone.querySelector('iframe').src = 'index.html?view=mobilframe&t=' + Date.now();
  document.querySelectorAll('.size button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.size button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      phone.style.width = b.dataset.w + 'px';
      phone.style.height = 'min(' + b.dataset.h + 'px, calc(100vh - 96px))';
      /* a new size reloads the page from the start, with the box (Søren, 19 Nov) */
      var f = phone.querySelector('iframe');
      f.src = 'index.html?view=mobilframe&w=' + b.dataset.w + '&t=' + Date.now();
    });
  });
</script>
</body>
</html>
